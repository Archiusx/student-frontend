<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>students</title>
<meta name="theme-color" content="#070707">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e0262c'/%3E%3C/svg%3E">
<style>
  :root { --bg:#070707; --fg:#cfcfcf; --dim:#7a7a7a; --red:#e0262c; --line:#3a1214; --ok:#3ddc84; }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Courier New", Courier, monospace; min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--red); color: #000; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* top strip */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 2px solid var(--red); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .bar input[type=search] { flex: 1 1 220px; min-width: 0; }
  .bar select { flex: 0 1 170px; }
  .count { color: var(--red); min-width: 3ch; text-align: right; }
  .dot { width: 10px; height: 10px; background: var(--dim); border: 0; padding: 0; }
  .dot[data-s=ok] { background: var(--ok); }
  .dot[data-s=bad] { background: var(--red); }
  .dot[data-s=wait] { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* controls */
  input, select { background: #000; border: 1px solid var(--line); padding: 6px 8px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--red); }
  input[aria-invalid=true], select[aria-invalid=true] { border-color: var(--red); background: #1a0506; }
  input:disabled { color: var(--dim); }
  .btn { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 6px 14px; }
  .btn:hover:not(:disabled) { background: var(--red); color: #000; }
  .btn.solid { background: var(--red); color: #000; }
  .btn.solid:hover:not(:disabled) { background: var(--fg); border-color: var(--fg); }
  .btn:disabled { opacity: .4; cursor: wait; }

  /* layout */
  .wrap { display: grid; grid-template-columns: minmax(0,1fr) 300px; align-items: start; }
  .list { padding: 14px; min-width: 0; }
  .side { padding: 14px; border-left: 1px dashed var(--line); position: sticky; top: 52px; }

  /* table */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-weight: normal; color: var(--dim); padding: 4px 8px 6px 0; border-bottom: 1px solid var(--red); white-space: nowrap; }
  .tbl td { padding: 7px 8px 7px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
  .tbl tbody tr:hover { background: #120405; }
  .tbl .sub { display: block; color: var(--dim); font-size: 12px; word-break: break-all; }
  .acts { white-space: nowrap; }
  .acts button { background: none; border: 1px solid var(--line); color: var(--fg); width: 28px; height: 28px; padding: 0; margin-right: 4px; }
  .acts button:hover { border-color: var(--red); color: var(--red); }
  .acts .armed { background: var(--red); color: #000; border-color: var(--red); width: auto; padding: 0 8px; }
  .msg { padding: 24px 0; color: var(--dim); }
  .msg.bad { color: var(--red); }
  .msg .btn { margin-left: 10px; padding: 2px 10px; }
  .pager { display: flex; gap: 10px; align-items: center; padding-top: 12px; color: var(--dim); }
  .pager .btn { padding: 2px 12px; }

  /* form */
  .mode { color: var(--red); margin-bottom: 10px; }
  .fld { display: block; margin-bottom: 10px; }
  .fld > span { display: block; color: var(--dim); margin-bottom: 2px; }
  .err { display: block; color: var(--red); font-size: 12px; min-height: 0; }
  .err:empty { display: none; }
  .row2 { display: flex; gap: 8px; margin-top: 4px; }
  .row2 .btn { flex: 1; }

  /* toast */
  .toast { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px; background: var(--fg); color: #000; transform: translateY(100%); transition: transform .12s steps(3); z-index: 20; }
  .toast.show { transform: none; }
  .toast.err { background: var(--red); }

  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
    .side { position: static; border-left: 0; border-top: 2px solid var(--red); }
    .bar select { flex: 1 1 45%; }
    .tbl thead { display: none; }
    .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
    .tbl tr { border-bottom: 1px dashed var(--red); padding: 8px 0; }
    .tbl td { border: 0; padding: 2px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
    .tbl td.acts { justify-content: flex-start; }
    .tbl td::before { content: attr(data-label); color: var(--dim); text-align: left; flex-shrink: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="bar">
  <input id="q" type="search" placeholder="/" aria-label="Search" autocomplete="off">
  <select id="deptFilter" aria-label="Department"><option value="">*</option></select>
  <select id="sortBy" aria-label="Sort">
    <option value="new">new</option><option value="name">name</option><option value="id">id</option><option value="sem">sem</option>
  </select>
  <span class="count" id="count" aria-live="polite">0</span>
  <button class="dot" id="ping" data-s="wait" aria-label="Server status" title="Server status"></button>
</div>

<div class="wrap">
  <main class="list">
    <table class="tbl">
      <thead><tr><th>id</th><th>name</th><th>dept</th><th>sem</th><th>phone</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="msg" id="state" aria-live="polite"></div>
    <div class="pager" id="pager" hidden>
      <button class="btn" id="prev" aria-label="Previous page">&lt;</button>
      <span id="pageInfo"></span>
      <button class="btn" id="next" aria-label="Next page">&gt;</button>
    </div>
  </main>

  <aside class="side">
    <div class="mode" id="mode">new</div>
    <form id="form" novalidate>
      <label class="fld"><span>id</span><input id="f_studentId" maxlength="20" autocomplete="off"><small class="err" id="e_studentId"></small></label>
      <label class="fld"><span>name</span><input id="f_name" maxlength="100" autocomplete="off"><small class="err" id="e_name"></small></label>
      <label class="fld"><span>email</span><input id="f_email" type="email" autocomplete="off"><small class="err" id="e_email"></small></label>
      <label class="fld"><span>phone</span><input id="f_contact" inputmode="numeric" maxlength="10" autocomplete="off"><small class="err" id="e_contact"></small></label>
      <label class="fld"><span>dept</span><select id="f_department"></select><small class="err" id="e_department"></small></label>
      <label class="fld"><span>sem</span>
        <select id="f_semester"><option value=""></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
        <small class="err" id="e_semester"></small></label>
      <div class="row2">
        <button class="btn solid" id="saveBtn" type="submit">save</button>
        <button class="btn" id="clearBtn" type="button">clear</button>
      </div>
    </form>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">JavaScript required.</p></noscript>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Config ---------- */
  var PROD_API = 'https://student-api-also.onrender.com';
  var isLocal = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;
  var BASE = isLocal ? 'http://localhost:5000' : PROD_API;
  var API = BASE + '/api/students';
  var PAGE_SIZE = 10;
  var DEPTS = ['Computer Science', 'Information Technology', 'Electronics', 'Electrical', 'Mechanical', 'Civil'];

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  /* ---------- Toast ---------- */
  var toastEl = $('toast'), toastT;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.className = 'toast'; }, 3500);
  }

  /* ---------- API helper ---------- */
  function api(url, opts, ms, extSignal) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms || 60000);
    if (extSignal) extSignal.addEventListener('abort', function () { ctrl.abort(); });
    var o = Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}, { signal: ctrl.signal });
    return fetch(url, o)
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || j.success === false) throw new Error(j.message || 'Request failed (' + r.status + ')');
          return j;
        });
      })
      .catch(function (e) {
        if (e.name === 'AbortError') throw new Error('Timed out. Server may be waking up. Retry.');
        if (e instanceof TypeError) throw new Error('Server unreachable. Wait ~30s and retry.');
        throw e;
      })
      .then(function (v) { clearTimeout(timer); return v; }, function (e) { clearTimeout(timer); throw e; });
  }

  /* ---------- Status dot ---------- */
  var dot = $('ping');
  function checkConn() {
    dot.setAttribute('data-s', 'wait');
    fetch(BASE + '/').then(function (r) { return r.json(); })
      .then(function (j) { dot.setAttribute('data-s', j && j.success ? 'ok' : 'bad'); })
      .catch(function () { dot.setAttribute('data-s', 'bad'); });
  }
  dot.addEventListener('click', checkConn);

  /* ---------- State ---------- */
  var state = { list: [], q: '', dept: '', sort: 'new', page: 1, total: null, reqId: 0, ctrl: null, editing: null, deptKey: '' };
  var rowsEl = $('rows'), stEl = $('state'), pager = $('pager');

  function showState(kind, msg) {
    if (kind === 'ok') { stEl.hidden = true; stEl.innerHTML = ''; return; }
    stEl.hidden = false;
    stEl.className = 'msg' + (kind === 'error' ? ' bad' : '');
    if (kind === 'loading') stEl.innerHTML = '<span id="loadMsg">...</span>';
    else if (kind === 'error') stEl.innerHTML = esc(msg) + '<button type="button" class="btn" id="retryBtn">retry</button>';
    else stEl.textContent = msg;
  }

  function rowHtml(s) {
    var id = esc(s.studentId);
    return '<tr>' +
      '<td data-label="id">' + id + '</td>' +
      '<td data-label="name"><div>' + esc(s.name) + '<span class="sub">' + esc(s.email) + '</span></div></td>' +
      '<td data-label="dept">' + esc(s.department) + '</td>' +
      '<td data-label="sem">' + esc(s.semester) + '</td>' +
      '<td data-label="phone">' + esc(s.contact || '-') + '</td>' +
      '<td class="acts"><button type="button" data-edit="' + id + '" aria-label="Edit ' + esc(s.name) + '" title="edit">e</button>' +
      '<button type="button" data-del="' + id + '" aria-label="Delete ' + esc(s.name) + '" title="delete">x</button></td></tr>';
  }

  function buildDeptOptions() {
    var set = {};
    state.list.forEach(function (s) { if (s.department) set[s.department] = 1; });
    if (state.dept) set[state.dept] = 1;
    var arr = Object.keys(set).sort();
    var key = arr.join('|');
    if (key === state.deptKey) return;
    state.deptKey = key;
    $('deptFilter').innerHTML = '<option value="">*</option>' + arr.map(function (d) {
      return '<option' + (d === state.dept ? ' selected' : '') + '>' + esc(d) + '</option>';
    }).join('');
  }

  function render() {
    buildDeptOptions();
    var l = state.list.slice();
    if (state.dept) l = l.filter(function (s) { return s.department === state.dept; });
    if (state.sort === 'name') l.sort(function (a, b) { return a.name.localeCompare(b.name); });
    else if (state.sort === 'id') l.sort(function (a, b) { return a.studentId.localeCompare(b.studentId, undefined, { numeric: true }); });
    else if (state.sort === 'sem') l.sort(function (a, b) { return a.semester - b.semester; });

    var pages = Math.max(1, Math.ceil(l.length / PAGE_SIZE));
    state.page = Math.min(Math.max(1, state.page), pages);
    var from = (state.page - 1) * PAGE_SIZE;
    rowsEl.innerHTML = l.slice(from, from + PAGE_SIZE).map(rowHtml).join('');

    var filtering = state.q || state.dept;
    $('count').textContent = filtering ? l.length + '/' + (state.total == null ? '?' : state.total) : l.length;

    if (!l.length) showState('empty', filtering ? 'no match' : 'empty');
    else showState('ok');

    pager.hidden = pages <= 1;
    $('pageInfo').textContent = state.page + '/' + pages;
    $('prev').disabled = state.page <= 1;
    $('next').disabled = state.page >= pages;
  }

  function loadList() {
    var id = ++state.reqId;
    if (state.ctrl) state.ctrl.abort();
    state.ctrl = new AbortController();
    rowsEl.innerHTML = '';
    pager.hidden = true;
    showState('loading');
    var slow = setTimeout(function () {
      var m = $('loadMsg');
      if (id === state.reqId && m) m.textContent = 'server waking up, up to 60s...';
    }, 4000);
    return api(API + (state.q ? '?q=' + encodeURIComponent(state.q) : ''), {}, 60000, state.ctrl.signal)
      .then(function (j) {
        if (id !== state.reqId) return;
        state.list = j.data || [];
        if (!state.q) state.total = state.list.length;
        dot.setAttribute('data-s', 'ok');
        render();
      })
      .catch(function (e) {
        if (id !== state.reqId) return;
        dot.setAttribute('data-s', 'bad');
        $('count').textContent = state.total == null ? '-' : state.total;
        showState('error', e.message);
      })
      .then(function () { clearTimeout(slow); });
  }

  /* search / filter / sort / pager */
  var searchT;
  $('q').addEventListener('input', function () {
    state.q = this.value.trim(); state.page = 1;
    clearTimeout(searchT); searchT = setTimeout(loadList, 350);
  });
  $('deptFilter').addEventListener('change', function () { state.dept = this.value; state.page = 1; render(); });
  $('sortBy').addEventListener('change', function () { state.sort = this.value; state.page = 1; render(); });
  $('prev').addEventListener('click', function () { state.page--; render(); });
  $('next').addEventListener('click', function () { state.page++; render(); });
  stEl.addEventListener('click', function (e) { if (e.target.id === 'retryBtn') loadList(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) $('q').blur();
  });

  /* ---------- Row actions: edit, delete (two-step, no modal) ---------- */
  var armed = null, armT;
  function disarm() {
    if (armed) { armed.classList.remove('armed'); armed.textContent = 'x'; armed = null; }
    clearTimeout(armT);
  }
  function doDelete(id, btn) {
    btn.disabled = true;
    api(API + '/' + encodeURIComponent(id), { method: 'DELETE' })
      .then(function (j) {
        toast(j.message || 'deleted');
        if (state.editing === id) resetForm();
        return loadList();
      })
      .catch(function (e) { toast(e.message, true); btn.disabled = false; disarm(); });
  }
  rowsEl.addEventListener('click', function (e) {
    var d = e.target.closest('[data-del]');
    if (d) {
      var id = d.getAttribute('data-del');
      if (armed === d) { var b = d; disarm(); doDelete(id, b); return; }
      disarm();
      armed = d; d.classList.add('armed'); d.textContent = 'sure?';
      armT = setTimeout(disarm, 3000);
      return;
    }
    var ed = e.target.closest('[data-edit]');
    if (ed) {
      disarm();
      var s = state.list.filter(function (x) { return x.studentId === ed.getAttribute('data-edit'); })[0];
      if (s) { resetForm(); setFormMode(s.studentId); fillForm(s); $('f_name').focus(); }
    }
  });

  /* ---------- Form ---------- */
  var FIELDS = ['studentId', 'name', 'email', 'department', 'semester', 'contact'];
  var form = $('form'), saveBtn = $('saveBtn');
  $('f_department').innerHTML = '<option value=""></option>' + DEPTS.map(function (d) { return '<option>' + d + '</option>'; }).join('');

  function val(f) { return $('f_' + f).value.trim(); }
  function setErr(f, msg) { $('e_' + f).textContent = msg || ''; $('f_' + f).setAttribute('aria-invalid', msg ? 'true' : 'false'); }
  function clearErrs() { FIELDS.forEach(function (f) { setErr(f, ''); }); }

  function validate() {
    clearErrs();
    var first = null;
    function bad(f, m) { setErr(f, m); if (!first) first = f; }
    var d = {}; FIELDS.forEach(function (f) { d[f] = val(f); });
    if (!/^[A-Za-z0-9-]{2,20}$/.test(d.studentId)) bad('studentId', '2-20 letters, numbers or hyphens');
    if (d.name.length < 2) bad('name', 'required');
    if (!/^\S+@\S+\.\S+$/.test(d.email)) bad('email', 'invalid email');
    if (!d.department) bad('department', 'required');
    if (!d.semester) bad('semester', 'required');
    if (d.contact && !/^\d{10}$/.test(d.contact)) bad('contact', '10 digits');
    if (first) { $('f_' + first).focus(); return null; }
    d.semester = Number(d.semester);
    if (!d.contact) delete d.contact;
    return d;
  }

  $('f_contact').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 10); });
  FIELDS.forEach(function (f) { $('f_' + f).addEventListener('input', function () { if (this.getAttribute('aria-invalid') === 'true') setErr(f, ''); }); });

  function setFormMode(editId) {
    state.editing = editId || null;
    $('mode').textContent = editId ? 'edit ' + editId : 'new';
    saveBtn.textContent = editId ? 'update' : 'save';
    $('f_studentId').disabled = !!editId;
  }
  function resetForm() { form.reset(); clearErrs(); setFormMode(null); }
  function fillForm(s) {
    FIELDS.forEach(function (f) {
      var el = $('f_' + f), v = s[f] == null ? '' : String(s[f]);
      if (f === 'department' && v && !Array.prototype.some.call(el.options, function (o) { return o.value === v; })) {
        var o = document.createElement('option'); o.textContent = v; el.appendChild(o);
      }
      el.value = v;
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var d = validate(); if (!d) return;
    var editing = state.editing;
    saveBtn.disabled = true; var label = saveBtn.textContent; saveBtn.textContent = '...';
    var req = editing
      ? api(API + '/' + encodeURIComponent(editing), { method: 'PUT', body: JSON.stringify(d) })
      : api(API, { method: 'POST', body: JSON.stringify(d) });
    req.then(function (j) { toast(j.message || 'saved'); resetForm(); return loadList(); })
      .catch(function (err) { toast(err.message, true); saveBtn.textContent = label; })
      .then(function () { saveBtn.disabled = false; });
  });
  $('clearBtn').addEventListener('click', resetForm);

  /* ---------- Boot ---------- */
  try { fetch(BASE + '/', { mode: 'no-cors' }).catch(function () {}); } catch (e) {}
  setFormMode(null);
  loadList();
})();
</script>
</body>
</html>
